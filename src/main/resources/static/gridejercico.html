<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .contenido {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 10px;
            max-width: 500px;
            border: 1px solid black;
            padding: 5px;
            background-color: antiquewhite;
        }

        .contenido > div {
            border: 2px solid blue;
            background-color: aqua;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .div-1 {
            /* Fila inicio, columna inicio, fila fin, columna fin */
            grid-area: 1 / 1 / 3 / 2;
        }

        .div-2 {
            grid-area: 1 / 2 / 3 / 4;
        }

        .div-3 {
            grid-area: 1 / 4 / 2 / 5;
        }

        .div-4 {
            grid-area: 2 / 4 / 3 / 5;
        }

        .div-5 {
            grid-area: 3 / 1 / 5 / 3;
        }

        .div-6 {
            grid-area: 4 / 3 / 5 / 5;
        }

        .div-7 {
            grid-area: 3 / 3 / 4 / 5;
        }
    </style>
</head>
<body>
<div class="contenido">
    <div class="div-1">1</div>
    <div class="div-2">2</div>
    <div class="div-3">3</div>
    <div class="div-4">4</div>
    <div class="div-5">5</div>
    <div class="div-6">6</div>
    <div class="div-7">7</div>
</div>
</body>
</html>
