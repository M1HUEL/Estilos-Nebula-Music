<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Iniciar Sesión</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">
        <form method="POST" action="/iniciar-sesion" enctype="application/x-www-form-urlencoded">
            <h1>Inicio de Sesion</h1>
            <div class="form-group">
                <label for="correo">Correo Electronico</label>
                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="correo@ejemplo.com"
                       minlength="5"
                       maxlength="100" required
                >
            </div>
            <div class="form-group">
                <label for="contrasena">Contrasena</label>
                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       placeholder="*********"
                       minlength="2"
                       maxlength="20"
                       required
                >
            </div>
            <div>
                <button type="submit" class="btn-primary">Iniciar Sesion</button>
                <button type="reset" class="btn-secondary">Limpiar Formulario</button>
            </div>
        </form>

        <p>
            Aun no tienes cuenta?
            <a href="registro.html">Registrate aqui</a>
        </p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
