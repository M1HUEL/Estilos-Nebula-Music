<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nébula Music - Registro</title>
    <link rel="stylesheet" href="../static/styles/styles.css">
</head>
<body>

<main class="auth-container">
    <section class="auth-card">

        <!-- TAREA PARA EL ALUMNO:
             Crea un formulario que envíe los datos mediante POST a "/crear-cuenta".
             Debe contener campos para:
             - Nombre completo (texto)
             - Correo electrónico (email)
             - Contraseña (password)
             - Pseudónimo (texto con patrón de validación: [letras de 3 a 10]-[números de 2 a 10])
             - Género (radio buttons: Femenino, Masculino, Otro)
             - Tipo de Suscripción (select: Gratis, Premium Mensual, Premium Anual)
             - Fecha de nacimiento (date)
             - Aceptar términos y condiciones (checkbox)
             - Comentarios adicionales o gustos (textarea)
        -->
        <form class="auth-form" method="POST" action="/crear-cuenta" enctype="application/x-www-form-urlencoded">
            <h1>Crear Cuenta</h1>
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text"
                       id="nombre"
                       name="nombre"
                       placeholder="ej. Miguel Angel"
                       minlength="3"
                       maxlength="80"
                       required/>
            </div>
            <div class="form-group">
                <label for="correo">Correo Electronico</label>
                <input type="email"
                       id="correo"
                       name="correo"
                       placeholder="tucorreo@ejemplo.com"
                       maxlength="100"
                       required/>
            </div>
            <div class="form-group">
                <label for="contrasena">Contrasena</label>
                <input type="password"
                       id="contrasena"
                       name="contrasena"
                       placeholder="******"
                       minlength="8"
                       required
                       autocomplete="off"
                />
            </div>
            <div class="form-group">
                <label for="pseudonimo">Pseudonimo</label>
                <input type="text"
                       id="pseudonimo"
                       name="pseudonimo"
                       placeholder="Nebula-2025"
                       minlength="6"
                       maxlength="100"
                       required
                       pattern="[a-zA-Z]{3,10}-[0-9]{2,10}"
                >
            </div>
            <div class="form-group">
                <label>Genero</label>
                <div class="radio-group">
                    <input type="radio" id="radio_femenino" name="genero" value="femenino" required>
                    <label for="radio_femenino">Femenino</label>

                    <input type="radio" id="radio_masculino" name="genero" value="masculino" required>
                    <label for="radio_masculino">Masculino</label>

                    <input type="radio" id="radio_otro" name="genero" value="otro" required>
                    <label for="radio_otro">Otro</label>
                </div>
            </div>
            <div class="form-group">
                <label for="suscripcion">Tipo de Suscripcion</label>
                <select id="suscripcion" name="suscripcion" required>
                    <option value="">-------- Selecciona una Opcion -------</option>
                    <option value="gratis">Gratis (Con Anuncios)</option>
                    <option value="premium_mensual">Premium Mensual (99$ al Mes)</option>
                    <option value="premium_anual">Premium Anual (899$ al Año)</option>
                </select>
            </div>
            <div class="form-group">
                <label for="fechaNacimiento">Fecha de Nacimiento</label>
                <input type="date"
                       id="fechaNacimiento"
                       name="fechaNacimiento"
                       required>
            </div>
            <div class="form-group">
                <div class="checkbox-group">
                    <input type="checkbox" id="terminos" name="terminos" required/>
                    <label for="terminos">Terminos y Condiciones</label>
                </div>
            </div>
            <div class="form-group">
                <label for="comentarios">Comentarios o Gustos</label>
                <textarea id="comentarios" name="comentarios" rows="4" cols="40"
                          placeholder="Escribe tu comentario aqui"></textarea>
            </div>
            <div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
                <button type="reset" class="btn-secondary">Limpiar Formulario</button>
            </div>
        </form>
        <p>
            Ya tienes cuenta?
            <a href="iniciar-sesion.html">Inicia Sesion aqui!</a>
        </p>
    </section>
</main>

<footer>
    <p>Copyright Nébula 2025.</p>
</footer>

</body>
</html>
